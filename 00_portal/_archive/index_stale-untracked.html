<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regent — Prototype Portal v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@300;400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased; }

    :root {
      --brand:     #211551;
      --canela:    'Cormorant Garamond', Georgia, serif;
      --engravers: 'Josefin Sans', 'Arial Narrow', sans-serif;
      --inter:     'Inter', system-ui, sans-serif;
      --ease:      cubic-bezier(0.4, 0, 0.2, 1);

      --sidebar-w:   256px;
      --toolbar-h:   52px;
      --sidebar-bg:  #0d0a1a;
      --canvas-bg:   #0e0c14;
      --tb-bg:       #18131f;

      --sb-text:       rgba(255,255,255,0.72);
      --sb-text-muted: rgba(255,255,255,0.28);
      --sb-border:     rgba(255,255,255,0.07);
      --sb-active:     rgba(255,255,255,0.09);
      --sb-hover:      rgba(255,255,255,0.04);
      --tb-border:     rgba(255,255,255,0.08);
      --tb-text:       rgba(255,255,255,0.55);
      --tb-active:     rgba(255,255,255,0.14);
    }

    /* ── Layout ───────────────────────────────────────────────── */
    .portal {
      display: flex;
      width: 100%; height: 100%;
      font-family: var(--inter);
    }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100%;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sb-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar__head {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--sb-border);
      flex-shrink: 0;
    }

    .sidebar__wordmark {
      display: block;
      font-family: var(--engravers);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.88);
      margin-bottom: 3px;
    }

    .sidebar__sub {
      font-family: var(--inter);
      font-size: 11px;
      font-weight: 300;
      color: var(--sb-text-muted);
      letter-spacing: 0.01em;
    }

    .sidebar__scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 32px;
    }

    .sidebar__scroll::-webkit-scrollbar { width: 3px; }
    .sidebar__scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar__scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 2px; }

    .sidebar__foot {
      flex-shrink: 0;
      padding: 14px 20px;
      border-top: 1px solid var(--sb-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar__author {
      font-family: var(--inter);
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.01em;
    }

    .sidebar__sprint {
      font-family: var(--engravers);
      font-size: 7.5px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    .sb-section { padding-top: 20px; }

    .sb-section__label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--engravers);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sb-text-muted);
      padding: 0 20px 10px;
    }

    .sb-section__label--review { color: rgba(74,188,118,0.55); }

    .sb-subsection { padding-top: 6px; }

    .sb-subsection__label {
      font-family: var(--engravers);
      font-size: 7.5px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      padding: 8px 20px 5px;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      cursor: pointer;
      transition: background 0.12s var(--ease);
      position: relative;
    }

    .sb-item:hover { background: var(--sb-hover); }

    .sb-item.is-active { background: var(--sb-active); }

    .sb-item.is-active::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 2px; height: 56%;
      background: rgba(255,255,255,0.35);
      border-radius: 1px;
    }

    .sb-item__label {
      flex: 1;
      font-family: var(--inter);
      font-size: 12.5px;
      font-weight: 300;
      color: var(--sb-text);
      line-height: 1.3;
    }

    .sb-item.is-active .sb-item__label { color: #fff; font-weight: 400; }

    .sb-item__tag {
      font-family: var(--engravers);
      font-size: 7px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      flex-shrink: 0;
    }

    .sb-item__tag--review { color: rgba(74,188,118,0.4); }
    .sb-item__tag--mobile { color: rgba(100,180,255,0.4); }

    /* ── Main ─────────────────────────────────────────────────── */
    .main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Toolbar ──────────────────────────────────────────────── */
    .toolbar {
      height: var(--toolbar-h);
      flex-shrink: 0;
      background: var(--tb-bg);
      border-bottom: 1px solid var(--tb-border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 6px;
    }

    .tb-group { display: flex; align-items: center; gap: 2px; }

    .tb-sep {
      width: 1px; height: 18px;
      background: var(--tb-border);
      margin: 0 8px;
    }

    .tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 6px;
      font-family: var(--engravers);
      font-size: 8.5px;
      font-weight: 400;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--tb-text);
      cursor: pointer;
      background: transparent;
      border: none;
      transition: background 0.12s var(--ease), color 0.12s var(--ease);
      white-space: nowrap;
    }

    .tb-btn svg { width: 13px; height: 13px; opacity: 0.6; flex-shrink: 0; }
    .tb-btn:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.82); }
    .tb-btn.is-active { background: var(--tb-active); color: #fff; }
    .tb-btn.is-active svg { opacity: 1; }

    /* Scale group */
    .tb-scale {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .tb-scale__label {
      font-family: var(--engravers);
      font-size: 7.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    .tb-slider {
      -webkit-appearance: none;
      width: 88px; height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 1px;
      outline: none;
      cursor: pointer;
    }

    .tb-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: rgba(255,255,255,0.65);
      cursor: pointer;
      transition: background 0.12s;
    }

    .tb-slider::-webkit-slider-thumb:hover { background: #fff; }

    .tb-scale__val {
      font-family: var(--inter);
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.38);
      width: 34px;
      text-align: right;
    }

    .tb-fit {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 4px;
      font-family: var(--engravers);
      font-size: 7.5px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.09);
      transition: all 0.12s;
    }

    .tb-fit:hover { color: rgba(255,255,255,0.65); border-color: rgba(255,255,255,0.22); }

    /* ── FAB cluster ─────────────────────────────────────────── */
    .fab-cluster {
      position: absolute;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .fab-cluster.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .fab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 100px;
      font-family: var(--engravers);
      font-size: 8.5px;
      font-weight: 400;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s var(--ease);
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
    }
    .fab svg { width: 13px; height: 13px; flex-shrink: 0; }

    .fab--share {
      color: #fff;
      background: var(--brand);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .fab--share svg { opacity: 0.8; }
    .fab--share:hover { background: #2e1e6e; box-shadow: 0 6px 32px rgba(0,0,0,0.55); }
    .fab--share.copied { background: #1a5c35; border-color: rgba(100,220,140,0.3); color: rgba(160,255,190,0.95); }

    .fab--open {
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .fab--open svg { opacity: 0.6; }
    .fab--open:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); box-shadow: 0 6px 32px rgba(0,0,0,0.55); }
    .fab--open:hover svg { opacity: 1; }

    /* ── QR modal ────────────────────────────────────────────── */
    .qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .qr-overlay.is-open { display: flex; }

    .qr-card {
      background: #1a1625;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-width: 260px;
    }

    .qr-label {
      font-family: var(--engravers);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
    }

    .qr-img {
      width: 180px; height: 180px;
      border-radius: 10px;
      background: #fff;
      display: block;
    }

    .qr-proto-name {
      font-family: var(--canela);
      font-size: 17px;
      font-weight: 300;
      color: rgba(255,255,255,0.72);
      text-align: center;
    }

    .qr-hint {
      font-family: var(--inter);
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.28);
      text-align: center;
    }

    .qr-close {
      margin-top: 4px;
      padding: 6px 20px;
      border-radius: 6px;
      font-family: var(--engravers);
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.12s;
    }
    .qr-close:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.25); }

    .qr-url-row {
      width: 100%;
    }

    .qr-url-input {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      font-family: var(--inter);
      font-size: 10px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.12s;
    }
    .qr-url-input:focus { border-color: rgba(255,255,255,0.28); color: rgba(255,255,255,0.85); }

    .qr-warning {
      display: none;
      font-family: var(--inter);
      font-size: 10px;
      font-weight: 300;
      color: rgba(255,200,80,0.75);
      text-align: center;
      line-height: 1.5;
    }
    .qr-warning code {
      font-family: 'Menlo', 'Courier New', monospace;
      font-size: 9.5px;
      background: rgba(255,200,80,0.12);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* ── Sub-row (model picker) ───────────────────────────────── */
    .subrow {
      height: 34px;
      flex-shrink: 0;
      background: var(--tb-bg);
      border-bottom: 1px solid var(--tb-border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 2px;
      opacity: 0.9;
    }

    .subrow__btn {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 5px;
      font-family: var(--engravers);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      cursor: pointer;
      background: transparent;
      border: none;
      white-space: nowrap;
      transition: background 0.12s var(--ease), color 0.12s var(--ease);
    }

    .subrow__btn:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); }

    .subrow__btn.is-active {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.9);
    }

    .subrow__btn__sub {
      font-size: 7px;
      letter-spacing: 0.1em;
      opacity: 0.5;
    }

    /* ── Canvas ───────────────────────────────────────────────── */
    .canvas {
      flex: 1;
      background: var(--canvas-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Wrapper constrains layout space to scaled dimensions */
    .scale-wrapper {
      flex-shrink: 0;
      position: relative;
    }

    /* Scaler renders at native device size, scaled via transform */
    .device-scaler {
      position: absolute;
      top: 0; left: 0;
      transform-origin: top left;
      transition: transform 0.25s var(--ease);
    }

    /* ── Empty state ──────────────────────────────────────────── */
    .canvas-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
    }

    .canvas-empty__title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.35);
    }

    .canvas-empty__hint {
      font-family: var(--inter);
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.02em;
    }

    /* ── iOS Shell ────────────────────────────────────────────── */
    .shell-ios {
      position: relative;
      width: 393px; height: 852px;
      border-radius: 47px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.13),
        0 60px 140px rgba(0,0,0,0.92);
    }

    .shell-ios[data-mode="light"] {
      background: #fff;
      --fill-0: #1b1b1b;
      --stroke-0: #1b1b1b;
      --icon-color: #1b1b1b;
      --text-primary: #1b1b1b;
    }

    .shell-ios[data-mode="dark"] {
      background: #000;
      --fill-0: #ffffff;
      --stroke-0: #ffffff;
      --icon-color: #ffffff;
      --text-primary: #ffffff;
    }

    .shell-ios .proto-frame {
      position: absolute;
      top: 59px; left: 0; right: 0; bottom: 94px;
      width: 100%;
      height: calc(100% - 59px - 94px);
      border: none;
    }

    .ios-status {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 59px;
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      padding-top: 13px;
    }

    .ios-status__blur {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
    }

    .ios-status__time {
      position: absolute;
      left: 0; width: 135px;
      text-align: center;
      top: 50%; transform: translateY(-50%);
      font-family: -apple-system, 'SF Pro Display', sans-serif;
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.4px; line-height: 1;
      color: var(--text-primary);
    }

    .ios-status__icons {
      position: absolute;
      right: 35px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 7px;
    }

    .ios-battery-wrap {
      position: relative;
      width: 27.333px; height: 13.667px;
      flex-shrink: 0;
    }

    .ios-battery-wrap__fill {
      position: absolute;
      left: 2px; top: 50%; transform: translateY(-50%);
      width: 21px; height: 9px;
      border-radius: 2.667px;
      background: var(--fill-0, #1b1b1b);
    }

    .ios-battery-wrap > svg {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
    }

    .ios-di {
      position: absolute;
      top: 13px; left: 50%; transform: translateX(-50%);
      width: 122px; height: 36px;
      background: #000; border-radius: 20px;
      z-index: 30; pointer-events: none;
    }

    .ios-bottom-blur {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 110px;
      z-index: 19; pointer-events: none;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      -webkit-mask-image: linear-gradient(to top, black 30%, transparent 100%);
      mask-image: linear-gradient(to top, black 30%, transparent 100%);
    }

    .ios-toolbar {
      position: absolute;
      bottom: 34px; left: 50%; transform: translateX(-50%) scale(1);
      display: flex; align-items: center; gap: 10px;
      z-index: 20; white-space: nowrap;
      transform-origin: center bottom;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .ios-pill {
      height: 48px; border-radius: 24px;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; border: 1px solid;
    }

    .shell-ios[data-mode="light"] .ios-pill {
      background: rgba(250,250,250,0.7);
      border-color: rgba(255,255,255,0.9);
      box-shadow: 0 2px 40px rgba(0,0,0,0.09);
    }

    .shell-ios[data-mode="dark"] .ios-pill {
      background: rgba(21,21,21,0.82);
      border-color: rgba(255,255,255,0.12);
      box-shadow: 0 2px 40px rgba(0,0,0,0.09);
    }

    .ios-pill--back { width: 48px; }
    .ios-pill--back svg { width: 22px; height: 22px; color: var(--icon-color); }

    .ios-pill--url {
      width: 218px; position: relative;
    }

    .ios-pill--url__domain {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: -apple-system, sans-serif;
      font-size: 17px; font-weight: 500; letter-spacing: -0.2px;
      white-space: nowrap; color: var(--text-primary);
    }

    .ios-pill--more { width: 48px; }

    .ios-pill--more__dots {
      display: flex; gap: 3.5px; align-items: center;
    }

    .ios-pill--more__dots span {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--icon-color);
    }

    .ios-home-bar {
      position: absolute;
      bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 3px;
      z-index: 25; pointer-events: none;
    }

    .shell-ios[data-mode="light"] .ios-home-bar { background: rgba(0,0,0,0.22); }
    .shell-ios[data-mode="dark"]  .ios-home-bar { background: rgba(255,255,255,0.28); }

    /* ── iOS scroll-collapsed pill ────────────────────────────── */
    .ios-scroll-pill {
      position: absolute;
      bottom: 34px; left: 50%;
      transform: translateX(-50%) scale(0.82);
      transform-origin: center bottom;
      height: 32px; padding: 0 18px;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      z-index: 20; cursor: pointer;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 2px 40px rgba(0,0,0,0.10);
    }

    .shell-ios[data-mode="light"] .ios-scroll-pill {
      background: rgba(250,250,250,0.7);
      border-color: rgba(255,255,255,0.9);
    }

    .shell-ios[data-mode="dark"] .ios-scroll-pill {
      background: rgba(21,21,21,0.82);
      border-color: rgba(255,255,255,0.12);
    }

    .ios-scroll-pill__text {
      font-family: -apple-system, sans-serif;
      font-size: 12px; font-weight: 510; letter-spacing: 0.12px;
      color: var(--text-primary);
    }

    /* Scrolled state — toolbar hides, pill appears */
    .shell-ios.ios-scrolled .ios-toolbar {
      opacity: 0; pointer-events: none;
      transform: translateX(-50%) scale(0.82);
    }

    .shell-ios.ios-scrolled .ios-scroll-pill {
      opacity: 1; pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    /* ── Android Shell ────────────────────────────────────────── */
    .shell-android {
      position: relative;
      width: 412px; height: 892px;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
      outline: 8px solid rgba(116,119,117,0.45);
      box-shadow: 0 60px 140px rgba(0,0,0,0.92);
    }

    .shell-android[data-mode="light"] {
      background: #f4fbf8;
      --and-surface:    #f4fbf8;
      --and-on-surface: #171d1b;
      --and-camera:     #2e2e2e;
      --and-pill-bg:    rgba(23,29,27,0.06);
      --and-divider:    rgba(23,29,27,0.08);
    }

    .shell-android[data-mode="dark"] {
      background: #191c1b;
      --and-surface:    #191c1b;
      --and-on-surface: #e1e3e0;
      --and-camera:     #2e2e2e;
      --and-pill-bg:    rgba(225,227,224,0.08);
      --and-divider:    rgba(225,227,224,0.06);
    }

    .shell-android .proto-frame {
      position: absolute;
      top: 96px; left: 0; bottom: 24px;
      width: 100%;
      height: calc(100% - 96px - 24px);
      border: none;
    }

    .and-status {
      position: absolute;
      top: 0; left: 0; right: 0; height: 40px;
      z-index: 20;
      display: flex; align-items: center; padding: 0 16px;
      background: var(--and-surface);
    }

    .and-status__time {
      font-family: 'Roboto', 'Google Sans', sans-serif;
      font-size: 14px; font-weight: 400; letter-spacing: 0.25px;
      color: var(--and-on-surface);
    }

    .and-status__icons {
      margin-left: auto;
      display: flex; align-items: center;
    }

    .and-punch {
      position: absolute;
      top: 8px; left: 50%; transform: translateX(-50%);
      width: 24px; height: 24px; border-radius: 100px;
      background: var(--and-camera);
      z-index: 30; pointer-events: none;
    }

    .and-abar {
      position: absolute;
      top: 40px; left: 0; right: 0; height: 56px;
      background: var(--and-surface);
      display: flex; align-items: center;
      padding: 8px 8px 8px 12px; gap: 4px;
      z-index: 20;
      border-bottom: 1px solid var(--and-divider);
    }

    .and-omnibox {
      flex: 1; height: 40px; border-radius: 20px;
      background: var(--and-pill-bg);
      display: flex; align-items: center; padding: 0 12px; gap: 8px;
    }

    .and-omnibox__domain {
      flex: 1;
      font-family: 'Roboto', sans-serif;
      font-size: 14px; font-weight: 400;
      color: var(--and-on-surface);
      text-align: center;
    }

    .and-btn {
      flex-shrink: 0;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .and-btn svg { width: 20px; height: 20px; }

    .and-gesture {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 24px;
      background: var(--and-surface);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }

    .and-gesture-pill {
      width: 108px; height: 4px; border-radius: 12px;
      background: var(--and-on-surface);
      opacity: 0.4;
    }

    /* ── Desktop Shell ────────────────────────────────────────── */
    .shell-desktop {
      position: relative;
      display: flex; flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 60px 140px rgba(0,0,0,0.8);
    }

    .shell-desktop[data-mode="dark"] {
      --dt-chrome-bg:  #2a2630;
      --dt-url-bg:     rgba(255,255,255,0.07);
      --dt-domain:     rgba(255,255,255,0.5);
      --dt-lock:       rgba(255,255,255,0.35);
    }

    .shell-desktop[data-mode="light"] {
      --dt-chrome-bg:  #e2e0e6;
      --dt-url-bg:     rgba(0,0,0,0.07);
      --dt-domain:     rgba(0,0,0,0.5);
      --dt-lock:       rgba(0,0,0,0.35);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.1),
        0 60px 140px rgba(0,0,0,0.4);
    }

    .desktop-chrome {
      flex-shrink: 0;
      height: 44px;
      background: var(--dt-chrome-bg, #2a2630);
      display: flex; align-items: center;
      padding: 0 16px; gap: 16px;
      transition: background 0.2s ease;
    }

    .desktop-chrome__dots {
      display: flex; gap: 6px; flex-shrink: 0;
    }

    .desktop-chrome__dot {
      width: 12px; height: 12px; border-radius: 50%;
    }

    .desktop-chrome__dot:nth-child(1) { background: #ff5f57; }
    .desktop-chrome__dot:nth-child(2) { background: #febe2e; }
    .desktop-chrome__dot:nth-child(3) { background: #28c840; }

    .desktop-chrome__urlbar {
      flex: 1; max-width: 440px; margin: 0 auto;
      height: 28px; border-radius: 6px;
      background: var(--dt-url-bg, rgba(255,255,255,0.07));
      display: flex; align-items: center; padding: 0 10px; gap: 6px;
      transition: background 0.2s ease;
    }

    .desktop-chrome__domain {
      flex: 1;
      font-family: -apple-system, sans-serif;
      font-size: 12px; font-weight: 400;
      color: var(--dt-domain, rgba(255,255,255,0.5));
      text-align: center;
      transition: color 0.2s ease;
    }

    .desktop-chrome__lock { color: var(--dt-lock, rgba(255,255,255,0.35)); }

    .shell-desktop .proto-frame {
      border: none; display: block; flex-shrink: 0;
    }
  </style>
</head>

            <rect x="3.5" y="3" width="9" height="12" rx="1.5"/>

    </header>

    <!-- Canvas -->

      <div class="fab-cluster" id="fabCluster">

        <button class="fab fab--open" id="tbOpen" onclick="handleOpen()">

          <svg id="tbOpenIconQR" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <rect x="2" y="2" width="5" height="5" rx="1"/>

        </button>
      </div>
    </div>

  </div>
</div>

/* ══════════════════════════════════════════════════════════════
   Render dispatcher
══════════════════════════════════════════════════════════════ */
function renderShell() {
  const proto = PROTOS.find(p => p.id === S.protoId);
  if (!proto) { showEmpty(); return; }

  const url = proto.urls[S.device] || proto.urls[proto.default] || '';

  if      (S.device === 'ios')     renderIos(url);
  else { teardownIosScroll(); }

  if      (S.device === 'android') renderAndroid(url);
  else if (S.device === 'desktop') renderDesktop(url);

  applyScale(S.scale);
}

function showEmpty() {
  const scaler = document.getElementById('deviceScaler');
  scaler.style.width  = '320px';
  scaler.style.height = '200px';
  scaler.innerHTML = `
    <div class="canvas-empty">
      <p class="canvas-empty__title">Pick a prototype</p>
      <p class="canvas-empty__hint">← Select from the sidebar</p>
    </div>`;
  const w = document.getElementById('scaleWrapper');
  w.style.width = '320px'; w.style.height = '200px';
}

/* ══════════════════════════════════════════════════════════════
   Scale
══════════════════════════════════════════════════════════════ */
function applyScale(scale) {
  const dims    = getDeviceDims();
  const scaler  = document.getElementById('deviceScaler');
  const wrapper = document.getElementById('scaleWrapper');

  scaler.style.transform       = `scale(${scale})`;
  scaler.style.transformOrigin = 'top left';

  wrapper.style.width  = (dims.w * scale) + 'px';
  wrapper.style.height = (dims.h * scale) + 'px';
}

function fitToCanvas() {
  const canvas  = document.getElementById('canvas');
  const dims    = getDeviceDims();
  const pad     = 80;
  const scaleX  = (canvas.offsetWidth  - pad) / dims.w;
  const scaleY  = (canvas.offsetHeight - pad) / dims.h;
  const scale   = Math.min(scaleX, scaleY, 1.0);
  const pct     = Math.round(scale * 100);
  S.scale       = scale;
  document.getElementById('scaleSlider').value = pct;
  document.getElementById('scaleVal').textContent = pct + '%';
  applyScale(scale);
}

function onScaleInput(val) {
  S.scale = val / 100;
  document.getElementById('scaleVal').textContent = val + '%';
  applyScale(S.scale);
}

/* ══════════════════════════════════════════════════════════════
   Sub-row: model picker
══════════════════════════════════════════════════════════════ */
function buildSubrow() {
  const subrow  = document.getElementById('subrow');
  const models  = MODELS[S.device];
  const activeId = S.models[S.device];

  subrow.innerHTML = models.map(m => `
    <button class="subrow__btn ${m.id === activeId ? 'is-active' : ''}"
            onclick="setModel('${m.id}')">
      ${m.label}${m.sub ? `<span class="subrow__btn__sub">${m.sub}</span>` : ''}
    </button>`).join('');
}

function setModel(id) {
  S.models[S.device] = id;
  buildSubrow();
  renderShell();
  fitToCanvas();
  syncURL();
}

/* ══════════════════════════════════════════════════════════════
   Device + Mode
══════════════════════════════════════════════════════════════ */
function setDevice(device) {
  S.device = device;
  document.querySelectorAll('[data-device]').forEach(b =>
    b.classList.toggle('is-active', b.dataset.device === device));
  buildSubrow();
  renderShell();
  fitToCanvas();
  syncURL();
  updateOpenBtn();
}

function setMode(mode) {
  S.mode = mode;
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('is-active', b.dataset.mode === mode));
  const shellEl = document.getElementById('shellEl');
  if (shellEl) shellEl.dataset.mode = mode;
  syncURL();
}

/* ══════════════════════════════════════════════════════════════
   Prototype selection
══════════════════════════════════════════════════════════════ */
function selectProto(id) {
  const proto = PROTOS.find(p => p.id === id);
  if (!proto) return;

  S.protoId = id;

  // Fall back to prototype's default device if current device has no URL
  if (!proto.urls[S.device]) {
    S.device = proto.default;
    document.querySelectorAll('[data-device]').forEach(b =>
      b.classList.toggle('is-active', b.dataset.device === S.device));
  }

  document.querySelectorAll('.sb-item').forEach(el =>
    el.classList.toggle('is-active', el.dataset.id === id));

  renderShell();
  fitToCanvas();
  syncURL();
  updateOpenBtn();
}

/* ══════════════════════════════════════════════════════════════
   iOS scroll detection — polling approach
   Event-based detection is unreliable across iframe load timing
   and custom scroll containers; polling the DOM is guaranteed.
══════════════════════════════════════════════════════════════ */
let _iosScrollPoll = null;

function teardownIosScroll() {
  if (_iosScrollPoll) { clearInterval(_iosScrollPoll); _iosScrollPoll = null; }
}

function setupIosScroll() {
  teardownIosScroll();

  const frame = document.getElementById('protoFrame');
  const shell = document.getElementById('shellEl');
  const pill  = document.getElementById('iosScrollPill');
  if (!frame || !shell || !pill) return;

  let scrolled = false;
  let prevTop  = 0;

  function setScrolled(val) {
    if (scrolled === val) return;
    scrolled = val;
    shell.classList.toggle('ios-scrolled', val);
    const bottom = val ? '72px' : '94px';
    frame.style.bottom = bottom;
    frame.style.height = `calc(100% - 59px - ${bottom})`;
  }

  pill.addEventListener('click', () => setScrolled(false));

  _iosScrollPoll = setInterval(() => {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;

      const root = doc.querySelector('.scroll-root') ||
                   doc.scrollingElement ||
                   doc.documentElement ||
                   doc.body;
      const top = root?.scrollTop || 0;

      if (top > prevTop && top > 40) setScrolled(true);
      else if (top < prevTop)        setScrolled(false);

      prevTop = top;
    } catch(e) {}
  }, 100);
}

/* ══════════════════════════════════════════════════════════════
   Clock
══════════════════════════════════════════════════════════════ */
let _clockTimer = null;

function startClock() {
  if (_clockTimer) clearInterval(_clockTimer);
  const tick = () => {
    const el = document.getElementById('shellClock');
    if (!el) { clearInterval(_clockTimer); return; }
    const now = new Date();
    el.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  };
  tick();
  _clockTimer = setInterval(tick, 15000);
}

/* ══════════════════════════════════════════════════════════════
   Sidebar builder
══════════════════════════════════════════════════════════════ */
function buildSidebar() {
  const container = document.getElementById('sidebarScroll');
  let html = '';

  // Ready for Review
  const reviewItems = PROTOS.filter(p => p.section === 'review');
  html += `
    <div class="sb-section">
      <p class="sb-section__label sb-section__label--review">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="rgba(74,188,118,0.55)" stroke-width="1"/>
          <polyline points="4.5,8.5 7,11 11.5,5.5" stroke="rgba(74,188,118,0.55)" stroke-width="1.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Ready for Review
      </p>`;
  reviewItems.forEach(p => {
    const tagClass = p.tags.includes('Mobile') && !p.tags.includes('Desktop')
      ? 'sb-item__tag--mobile'
      : 'sb-item__tag--review';
    html += `<div class="sb-item" data-id="${p.id}" onclick="selectProto('${p.id}')">
      <span class="sb-item__label">${p.label}</span>
      <span class="sb-item__tag ${tagClass}">${p.tags.join(' · ')}</span>
    </div>`;
  });
  html += `</div>`;

  // Explorations — grouped by subsection
  const explItems = PROTOS.filter(p => p.section === 'explorations');
  const subsections = [...new Set(explItems.map(p => p.subsection))];

  html += `
    <div class="sb-section">
      <p class="sb-section__label">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none"
             stroke="rgba(255,255,255,0.28)" stroke-width="1"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 1h6M6 1v5L2 13a1 1 0 00.9 1.5h10.2A1 1 0 0014 13L10 6V1"/>
        </svg>
        Explorations
      </p>`;

  subsections.forEach(sub => {
    html += `<div class="sb-subsection">
      <p class="sb-subsection__label">${sub}</p>`;
    explItems.filter(p => p.subsection === sub).forEach(p => {
      const isMobileOnly = p.tags.includes('Mobile') && !p.tags.includes('Desktop');
      const tagClass = isMobileOnly ? 'sb-item__tag--mobile' : '';
      html += `<div class="sb-item" data-id="${p.id}" onclick="selectProto('${p.id}')">
        <span class="sb-item__label">${p.label}</span>
        <span class="sb-item__tag ${tagClass}">${p.tags.join(' · ')}</span>
      </div>`;
    });
    html += `</div>`;
  });

  html += `</div>`;
  container.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   Deep links — sync state to/from URL
══════════════════════════════════════════════════════════════ */
function syncURL() {
  const p = new URLSearchParams();
  if (S.protoId) p.set('proto',  S.protoId);
  p.set('device', S.device);
  p.set('model',  S.models[S.device]);
  p.set('mode',   S.mode);
  history.replaceState(null, '', '?' + p.toString());
}

function restoreFromURL() {
  const p = new URLSearchParams(location.search);
  if (p.has('mode'))   { S.mode   = p.get('mode');   }
  if (p.has('device')) { S.device = p.get('device'); }
  if (p.has('model'))  { S.models[S.device] = p.get('model'); }

  // Sync toolbar UI to restored state
  document.querySelectorAll('[data-device]').forEach(b =>
    b.classList.toggle('is-active', b.dataset.device === S.device));
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('is-active', b.dataset.mode === S.mode));

  if (p.has('proto')) {
    selectProto(p.get('proto'));  // renders shell + updates sidebar
  }
}

══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   Open / QR
══════════════════════════════════════════════════════════════ */
function currentProtoURL() {
  const proto = PROTOS.find(p => p.id === S.protoId);
  if (!proto) return null;
  const rel = proto.urls[S.device] || proto.urls[proto.default];
  if (!rel) return null;
  return new URL(rel, location.href).href;
}

function updateOpenBtn() {
  const cluster = document.getElementById('fabCluster');
  const icoD    = document.getElementById('tbOpenIconDesktop');
  const icoQR   = document.getElementById('tbOpenIconQR');
  const lbl     = document.getElementById('tbOpenLabel');
  if (!S.protoId) { cluster.classList.remove('is-visible'); return; }
  cluster.classList.add('is-visible');
  if (S.device === 'desktop') {
    icoD.style.display  = '';
    icoQR.style.display = 'none';
    lbl.textContent     = 'Open in Browser';
  } else {
    icoD.style.display  = 'none';
    icoQR.style.display = '';
    lbl.textContent     = 'View on Device';
  }
}

let _shareTimeout = null;
function shareLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.getElementById('tbShare');
    const lbl = document.getElementById('tbShareLabel');
    btn.classList.add('copied');
    lbl.textContent = 'Copied!';
    clearTimeout(_shareTimeout);
    _shareTimeout = setTimeout(() => {
      btn.classList.remove('copied');
      lbl.textContent = 'Share Link';
    }, 2000);
  });
}

function handleOpen() {
  if (!S.protoId) return;
  if (S.device === 'desktop') {
    window.open(currentProtoURL(), '_blank');
  } else {
    showQR();
  }
}

function setQRCode(url) {
  const encoded = encodeURIComponent(url);
  document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=16&data=${encoded}`;
}

function showQR() {
  const url   = currentProtoURL();
  const proto = PROTOS.find(p => p.id === S.protoId);
  if (!url || !proto) return;

  const isLocalhost = /localhost|127\.0\.0\.1/.test(url);
  const input       = document.getElementById('qrUrlInput');
  const warning     = document.getElementById('qrWarning');

  input.value = url;
  setQRCode(url);
  document.getElementById('qrProtoName').textContent = proto.label;
  warning.style.display = isLocalhost ? 'block' : 'none';
  document.getElementById('qrOverlay').classList.add('is-open');
}

function onQRUrlInput(val) {
  if (val.trim()) setQRCode(val.trim());
}

function closeQR() {
  document.getElementById('qrOverlay').classList.remove('is-open');
}

// Close on backdrop click
document.getElementById('qrOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeQR();
});
</script>

<!-- QR modal -->
<div class="qr-overlay" id="qrOverlay">
  <div class="qr-card">
    <span class="qr-label">View on Device</span>
    <img class="qr-img" id="qrImg" src="" alt="QR code">
    <div class="qr-proto-name" id="qrProtoName"></div>
    <div class="qr-url-row">
      <input class="qr-url-input" id="qrUrlInput" type="text" spellcheck="false"
             oninput="onQRUrlInput(this.value)">
    </div>
    <div class="qr-warning" id="qrWarning">
      Replace <code>localhost</code> with your Mac's IP — run <code>ipconfig getifaddr en0</code> in Terminal
    </div>
    <div class="qr-hint">Scan with your phone to open in the native browser</div>
    <button class="qr-close" onclick="closeQR()">Dismiss</button>
  </div>
</div>

</body>
</html>
